<svg class="map-svg" viewBox="0 0 360 310" role="img" aria-label="Hypothetical Roofline: linear bandwidth ceiling until 10 FLOP per byte, then compute ceiling 100 GFLOP per second" xmlns="http://www.w3.org/2000/svg" color="#152747" font-family="Arial, sans-serif"><desc>Calculated Roofline ceiling: min(peak compute, bandwidth × operational intensity). Authored device assumptions: 100 GFLOP/s compute and 10 GB/s memory bandwidth. Operational intensity counts FLOPs per byte transferred from the specified external memory. No measured performance.</desc><path d="M50 30V260H340" stroke="currentColor" fill="none"></path><polyline points="50,260 67.5,218 85,176 102.5,134 120,92 137.5,50 190,50 260,50 330,50" fill="none" stroke="#7c3aed" stroke-width="4"></polyline><text x="50" y="280" text-anchor="middle" font-size="16" fill="currentColor">0</text><text x="120" y="280" text-anchor="middle" font-size="16" fill="currentColor">8</text><text x="190" y="280" text-anchor="middle" font-size="16" fill="currentColor">16</text><text x="260" y="280" text-anchor="middle" font-size="16" fill="currentColor">24</text><text x="330" y="280" text-anchor="middle" font-size="16" fill="currentColor">32</text><text x="8" y="55" fill="currentColor" font-size="16">100</text><text x="22" y="260" fill="currentColor" font-size="16">0</text><text x="55" y="18" fill="currentColor" font-size="16">Ceiling (GFLOP/s)</text><text x="50" y="305" fill="currentColor" font-size="16">Operational intensity (FLOP/byte)</text></svg>
